name: Aletheia CI/CD

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel previous runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
        exclude:
          - os: macos-latest
            python-version: '3.12'  # Skip Python 3.12 on macOS for now if needed

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: '**/requirements*.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Run linters
      run: |
        echo "Running black..."
        black --check .
        
        echo "Running isort..."
        isort --check-only .
        
        echo "Running flake8..."
        flake8 .
        
        echo "Running mypy..."
        mypy --install-types --non-interactive .

    - name: Run tests with coverage
      run: |
        python -m pytest \
          --cov=aletheia \
          --cov-report=xml:coverage.xml \
          --cov-report=term \
          --durations=10 \
          -v \
          --maxfail=10 \
          --disable-warnings

    - name: Upload coverage to Codecov
      if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false

  swift-checks:
    name: Swift Checks
    runs-on: macos-latest
    if: contains(github.event.pull_request.labels.*.name, 'swift') || !github.event.pull_request
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Swift
      uses: fwcd/swift-macOS@v1
      with:
        version: 5.9

    - name: Build
      run: |
        swift build -v
        
    - name: Run tests
      run: |
        swift test -v

  docs:
    name: Build Docs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements-dev.txt
        
    - name: Build documentation
      run: |
        mkdocs build --site-dir public
        
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        keep_files: true