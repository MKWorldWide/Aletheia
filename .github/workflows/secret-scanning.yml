name: Secret Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: zricethezav/gitleaks-action@v2.3.0
        with:
          config-path: .gitleaks.toml

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          exclude_paths: |
            **/node_modules/**
            **/venv/**
            **/dist/**
            **/build/**
            **/*.min.*
            **/*.bundle.*
            **/package-lock.json
            **/yarn.lock
            **/pnpm-lock.yaml
            **/go.sum
            **/vendor/**
            **/__pycache__/**
            **/*.pyc
            **/*.pyo
            **/*.pyd
            **/*.so
            **/*.dll
            **/*.dylib
            **/*.a
            **/*.o
            **/*.obj
            **/*.lib
            **/*.exe
            **/*.out
            **/*.app
            **/*.ipa
            **/*.apk
            **/*.aab
            **/*.dmg
            **/*.pkg
            **/*.deb
            **/*.rpm
            **/*.snap
            **/*.zip
            **/*.tar.gz
            **/*.7z
            **/*.rar
            **/*.jpg
            **/*.jpeg
            **/*.png
            **/*.gif
            **/*.bmp
            **/*.tiff
            **/*.ico
            **/*.svg
            **/*.mp3
